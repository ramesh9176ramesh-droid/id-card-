<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<html>
<head>
    <title>Student ID Card</title>

    <style>
        body {
            background-color: #e8eef5;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            
        }

        .card {
            width: 320px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 5px 15px gray;
            font-family:'Times New Roman';
            
        }

        .header {
            background:cadetblue;
            padding: 10px;
        }

        .header h2 {
            margin: 5px;
        }

        .photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid gray;
            margin-top: 20px;
            object-fit: cover;
        }

        .details {
            padding: 15px;
            text-align: left;
        }

        .details p {
            font-size: 14px;
            margin: 12px;
        }

        .footer {
            background:cadetblue;
            padding: 12px;
            transition-delay: 2s;
            color:black;
        }
        .IMG{
            display:flex;
            margin:5PX;
            justify-content: center;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="header">
        <h2>STUDENT ID CARD</h2>
        <p>SLA INSTITUTE</p>
    </div>
<div class="IMG">
   <img src="image.jpg" alt="my image" width="120" height="120">
</div>
    

    <h2>RAMESH</h2>

    <div class="details">
        <p><b>ID Number:</b> 7159</p>
        <p><b>Course:</b> Full Stack Development</p>
        <p><b>Batch:</b>8 to 12</p>
        <p><b>Department:</b> Computer Science</p>
    </div>

    <div class="footer">
        <b>2026 - 2027</b>
    </div>

</div>

</body>
</html>
</body>
</html>
